# [terminal.shell]
# program = "ssh"
# args = ["-p", "22", "host@ip"]

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Medium"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[window]
opacity = 0.92
decorations = "Buttonless"
dynamic_padding = true
title = "Alacritty"
dynamic_title = false
dimensions = { columns = 140, lines = 32 }

[window.padding]
x = 8
y = 8

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[selection]
save_to_clipboard = false
